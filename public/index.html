<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый учёт</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<section id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>Финансовый учёт</h1>
    <p class="subtitle">Учёт доходов и расходов</p>
    <div class="auth-tabs">
      <button id="tab-login" class="tab active" type="button">Вход</button>
      <button id="tab-register" class="tab" type="button">Регистрация</button>
    </div>
    <form id="auth-form">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" required autocomplete="email">
      <label for="auth-password">Пароль</label>
      <input type="password" id="auth-password" required minlength="6" autocomplete="current-password">
      <div id="auth-error" class="error hidden" role="alert"></div>
      <button type="submit" id="auth-submit" class="btn-primary">Войти</button>
    </form>
  </div>
</section>

<section id="app-screen" class="app-screen hidden">
  <header class="app-header">
    <h1>Финансовый учёт</h1>
    <div class="header-right">
      <span id="user-email"></span>
      <button id="logout-btn" class="btn-secondary" type="button">Выйти</button>
    </div>
  </header>
  <main class="app-main">
    <section class="card">
      <h2>Сводка за <span id="current-month-label"></span></h2>
      <div class="summary-grid">
        <div class="summary-item income"><span class="summary-label">Доходы</span><span class="summary-value" id="sum-income">—</span></div>
        <div class="summary-item expense"><span class="summary-label">Расходы</span><span class="summary-value" id="sum-expense">—</span></div>
        <div class="summary-item balance"><span class="summary-label">Баланс</span><span class="summary-value" id="sum-balance">—</span></div>
      </div>
      <div class="charts-grid">
        <div class="chart-container">
          <h3>Расходы по категориям</h3>
          <canvas id="chart-categories"></canvas>
          <p id="chart-categories-empty" class="empty-msg hidden">Нет расходов за этот месяц</p>
        </div>
        <div class="chart-container">
          <h3>Динамика за 6 месяцев</h3>
          <canvas id="chart-monthly"></canvas>
        </div>
      </div>
    </section>
    <section class="card">
      <h2>Бюджеты на <span id="budget-month-label"></span></h2>
      <div id="budgets-list" class="budgets-list"><p class="empty-msg">Загрузка...</p></div>
    </section>
    <section class="card">
      <h2>Операции</h2>
      <form id="tx-form" class="tx-form">
        <div class="form-row"><label for="tx-category">Категория</label><select id="tx-category" required></select></div>
        <div class="form-row"><label for="tx-amount">Сумма</label><input type="number" id="tx-amount" min="0.01" step="0.01" required></div>
        <div class="form-row"><label for="tx-date">Дата</label><input type="date" id="tx-date" required></div>
        <div class="form-row"><label for="tx-note">Комментарий</label><input type="text" id="tx-note" maxlength="200"></div>
        <button type="submit" class="btn-primary">Добавить</button>
        <div id="tx-error" class="error hidden" role="alert"></div>
      </form>
      <div class="filters">
        <label for="filter-from">С</label><input type="date" id="filter-from">
        <label for="filter-to">По</label><input type="date" id="filter-to">
        <button id="filter-apply" class="btn-secondary" type="button">Применить</button>
        <button id="filter-reset" class="btn-secondary" type="button">Сбросить</button>
      </div>
      <table class="tx-table">
        <thead><tr><th>Дата</th><th>Категория</th><th>Сумма</th><th>Комментарий</th><th></th></tr></thead>
        <tbody id="tx-tbody"><tr><td colspan="5" class="empty-msg">Загрузка...</td></tr></tbody>
      </table>
    </section>
    <section class="card">
      <h2>Категории</h2>
      <form id="cat-form" class="cat-form">
        <input type="text" id="cat-name" placeholder="Название" required maxlength="50">
        <select id="cat-type" required><option value="expense">Расход</option><option value="income">Доход</option></select>
        <button type="submit" class="btn-primary">Добавить категорию</button>
        <div id="cat-error" class="error hidden" role="alert"></div>
      </form>
      <ul id="cat-list" class="cat-list"><li class="empty-msg">Загрузка...</li></ul>
    </section>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
